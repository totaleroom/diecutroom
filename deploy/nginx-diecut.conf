# Nginx Reverse Proxy Configuration for DieCut.Room Subdomain (Debian sites-available)
# 1. Copy to /etc/nginx/sites-available/diecut-room and symlink to /etc/nginx/sites-enabled/diecut-room
# 2. Replace "cad.domainanda.com" with your DNS-managed subdomain.
# 3. Replace "127.0.0.1:3000" if you set a different HOST_PORT/PORT (e.g. 3001) on a multi-app VPS.
# 4. Debian 13+ / Nginx 1.25.1+: if `nginx -t` warns about `listen 443 ssl http2;`,
#    change to `listen 443 ssl;` + `listen [::]:443 ssl;` and add `http2 on;` below it.
# 5. For brute-force rate limiting, create /etc/nginx/conf.d/diecut-ratelimit.conf (see docs/07-TROUBLESHOOTING-AND-SECURITY.md)
#    and uncomment the `limit_req` line in the /api/auth/ block below.

server {
    listen 80;
    listen [::]:80;
    server_name cad.domainanda.com;

    # Redirect all HTTP traffic to HTTPS (handled automatically after running certbot --nginx)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cad.domainanda.com;

    # Paths generated by: sudo certbot --nginx -d cad.domainanda.com
    ssl_certificate /etc/letsencrypt/live/cad.domainanda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cad.domainanda.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Match Express 2mb JSON limit with headroom for large SavedBoxProject payloads
    client_max_body_size 3m;

    # Hardening HTTP Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for SVG/JS/CSS/JSON bundles
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Auth endpoints (uncomment limit_req after adding /etc/nginx/conf.d/diecut-ratelimit.conf)
    location ~ ^/api/auth/(login|register)$ {
        # limit_req zone=diecut_room_auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never cache Service Worker, manifest, or HTML shell so PWA updates propagate immediately
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy API & SPA traffic to Node.js Express server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
